[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corsone"
dynamic = ["version"]
description = "Fast cross-origin resource sharing (CORS) misconfiguration scanner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.15"
authors = [{ name = "Mohammad Reza Omrani" }]
keywords = ["security", "cors", "web", "scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "aiohttp>=3.14.4",
    "aiodns>=4.0.4",
    "validators>=0.35",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "build>=1.6.1",
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/omranisecurity/CorsOne"
Repository = "https://github.com/omranisecurity/CorsOne"
Issues = "https://github.com/omranisecurity/CorsOne/issues"
Documentation = "https://github.com/omranisecurity/CorsOne#readme"

[project.scripts]
corsone = "corsone.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "corsone.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/corsone"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
