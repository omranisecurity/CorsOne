name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.24
          uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --no-sync ruff check .

      - name: Type check
        run: uv run --locked --no-sync mypy src

      - name: Run tests
        run: uv run --locked --no-sync pytest --cov=src/corsone --cov-report=term-missing

      - name: Build distribution
        run: uv run --locked --no-sync python -m build --no-isolation

      - name: Dependency audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --locked --no-sync pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt"
